name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/security.yml

  release:
    name: Publish verified package
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Verify tag and protected release commit
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match v$version" >&2; exit 1; }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Release tag must point at current main' >&2; exit 1; }
      - run: npm ci
      - run: npm run validate
      - run: npm run check:spec-drift
      - name: Pack release tarball
        run: npm pack
      - name: Verify package contents
        run: npm run test:package
      - name: Compute checksum
        run: shasum -a 256 -- ./*.tgz > checksums.txt
      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            *.tgz
            checksums.txt
